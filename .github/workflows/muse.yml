# Muse: site edits by message.
#
# Someone with write access to this repo opens an issue (or comments on one)
# with the word "Muse" in it, e.g. "Hi Muse, add this event: ...". Claude reads
# CLAUDE.md, makes the change on a branch, and replies with a link to open a
# pull request. Vercel posts a preview link on the PR; merging it puts it live.
#
# Needs two things set up once, by the repo owner:
#   1. The Claude GitHub app installed on this repo: https://github.com/apps/claude
#   2. A repo secret CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`)

name: Muse

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  muse:
    # Public repo: only people added to it can trigger this. The action checks
    # write access again itself. contains() here is case-insensitive.
    if: >-
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
        github.event.comment.author_association || github.event.issue.author_association) &&
      contains(github.event.comment.body || format('{0} {1}', github.event.issue.title, github.event.issue.body), 'muse')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: muse-${{ github.event.issue.number || github.event.pull_request.number }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # The action matches its trigger word case-sensitively, and people type
      # both "Muse" and "muse". Hand it whichever spelling the message used.
      - id: phrase
        env:
          TEXT: ${{ github.event.comment.body || format('{0} {1}', github.event.issue.title, github.event.issue.body) }}
        run: |
          word=$(printf '%s' "$TEXT" | grep -oiE '(^|[[:space:]])muse([[:space:].,!?;:]|$)' | head -1 | grep -oiE 'muse' || true)
          echo "word=${word:-Muse}" >> "$GITHUB_OUTPUT"

      # For tools/clean-backdrop.py (release artwork).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow numpy scipy

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: ${{ steps.phrase.outputs.word }}
          claude_args: |
            --allowedTools "Bash(curl:*),Bash(python3:*),Bash(node --check:*),WebFetch,WebSearch"
