# @dialedbot: site edits by message.
#
# Someone with write access to this repo opens an issue (or comments on one)
# that says @dialedbot, e.g. "@dialedbot add this event: ...". Claude reads
# CLAUDE.md, makes the change on a branch, and replies with a link to open a
# pull request. Vercel posts a preview link on the PR; merging it puts it live.
# Also answers to "Dialed Bot", "dialed bot" and "dialed-bot", for when the @
# gets forgotten. (No GitHub user owns "dialedbot" as of Nov 2026, so the
# mention pings nobody. If someone registers it, switch the name.)
#
# Needs two things set up once, by the repo owner:
#   1. The Claude GitHub app installed on this repo: https://github.com/apps/claude
#   2. A repo secret CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`)

name: Dialed Bot

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  dialed-bot:
    # Public repo: only people added to it can trigger this. The action checks
    # write access again itself. contains() here is case-insensitive; the
    # exact name check happens in the "name" step.
    if: >-
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
        github.event.comment.author_association || github.event.issue.author_association) &&
      contains(github.event.comment.body || format('{0} {1}', github.event.issue.title, github.event.issue.body), 'dialed')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: dialed-bot-${{ github.event.issue.number || github.event.pull_request.number }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      # The action matches its trigger case-sensitively, and people type
      # "Dialed Bot", "dialed bot", "@dialedbot"... Find which one the message
      # used and hand the action that exact spelling. No match, nothing runs.
      - id: name
        env:
          TEXT: ${{ github.event.comment.body || format('{0} {1}', github.event.issue.title, github.event.issue.body) }}
        run: |
          word=$(printf '%s' "$TEXT" | grep -oiE '(^|[[:space:]])@?dialed[ -]?bot([[:space:].,!?;:]|$)' | head -1 | grep -oiE '@?dialed[ -]?bot' || true)
          echo "word=$word" >> "$GITHUB_OUTPUT"

      - if: steps.name.outputs.word != ''
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # For tools/clean-backdrop.py (release artwork).
      - if: steps.name.outputs.word != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: steps.name.outputs.word != ''
        run: pip install pillow numpy scipy

      - if: steps.name.outputs.word != ''
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: ${{ steps.name.outputs.word }}
          claude_args: |
            --allowedTools "Bash(curl:*),Bash(python3:*),Bash(node --check:*),WebFetch,WebSearch"
